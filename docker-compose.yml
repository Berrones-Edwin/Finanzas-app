services:
  mysql:
    image: mysql:8.0
    container_name: financial_app_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: financial_app
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data: